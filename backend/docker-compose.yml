# Local development services for the Lop-rig API.
# Postgres listens on host port 5433 so it does not clash with other local databases.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loprig
      POSTGRES_USER: loprig
      POSTGRES_PASSWORD: loprig
    ports:
      - "5433:5432"
    volumes:
      - loprig_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loprig -d loprig"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  loprig_pgdata:



